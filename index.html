<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olango Fiber Network — Payment Tracker</title>
<style>
:root {
  --blue:#2563eb; --bg:#f3f6fb; --ink:#172033;
  --muted:#64748b; --line:#dce3ee;
}
* { box-sizing:border-box }
body {
  margin:0; font:15px system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
}
header {
  background:#15233d; color:white; padding:18px;
  display:flex; justify-content:space-between;
  align-items:center; flex-wrap:wrap; gap:12px;
}
h1 { margin:0; font-size:22px }
h2 { margin:0 0 16px }
h3 { margin:8px 0 }
small,.muted { color:var(--muted) }
header small { color:#cbd5e1 }
button,input,select,textarea {
  font:inherit; padding:10px; border:1px solid var(--line);
  border-radius:8px;
}
button { cursor:pointer; background:white }
button.primary { background:var(--blue); color:white; border:0 }
button.danger { color:#b91c1c }
button:disabled { opacity:.5; cursor:not-allowed }
nav {
  display:flex; gap:8px; padding:12px 18px; overflow:auto;
  background:white; border-bottom:1px solid var(--line);
}
nav button.active { background:var(--blue); color:white }
main { max-width:1250px; margin:auto; padding:20px }
.banner {
  background:#fff3cd; padding:12px 18px;
  border-bottom:1px solid #edd78e;
}
.card {
  background:white; border:1px solid var(--line);
  border-radius:12px; padding:18px; margin-bottom:16px;
}
.grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px;
}
.metric strong { display:block; font-size:26px; margin-top:8px }
.toolbar {
  display:flex; flex-wrap:wrap; gap:10px;
  align-items:center; margin-bottom:16px;
}
.table-wrap { overflow:auto }
table { width:100%; border-collapse:collapse; white-space:nowrap }
th,td {
  padding:11px; text-align:left; border-bottom:1px solid var(--line);
}
th { background:#f8fafc }
.badge {
  display:inline-block; border-radius:20px; padding:4px 9px;
  background:#e8efff; font-size:12px;
}
.badge.warn { background:#fff0d4; color:#92400e }
.badge.bad { background:#fee2e2; color:#991b1b }
.calendar {
  display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px;
}
.day {
  min-height:110px; text-align:left; background:white;
  padding:8px; overflow:hidden;
}
.day small { display:block; font-size:11px; white-space:normal }
.day.selected { outline:2px solid var(--blue) }
dialog {
  border:0; border-radius:12px; width:min(600px,95vw);
  max-height:90vh; padding:22px;
}
dialog::backdrop { background:#0008 }
label { display:block; margin:12px 0 }
label input,label select,label textarea { width:100%; margin-top:5px }
.actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px }
#notice {
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  background:#172033; color:white; padding:12px 20px;
  border-radius:10px; z-index:20; max-width:90%;
}
.empty { padding:20px; color:var(--muted) }
@media(max-width:600px) {
  main { padding:12px }
  .day { min-height:85px; padding:5px }
  .day small { font-size:9px }
  th,td { padding:8px }
}
</style>

  <script>
"use strict";

const KEY = "isp-tracker-prototype-v1";
const $ = id => document.getElementById(id);
const uuid = () => crypto.randomUUID();
const esc = value => String(value ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);

function today() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone:"Asia/Manila", year:"numeric", month:"2-digit", day:"2-digit"
  }).formatToParts(new Date());
  const get = type => parts.find(p => p.type === type).value;
  return `${get("year")}-${get("month")}-${get("day")}`;
}
const monthOf = day => typeof day === "string" ? day.slice(0,7) : "";
const thisMonth = () => monthOf(today());
function nextMonth(month) {
  const [y,m] = month.split("-").map(Number);
  const d = new Date(Date.UTC(y,m,1));
  return d.toISOString().slice(0,7);
}
function dueDate(month,day) {
  const [y,m] = month.split("-").map(Number);
  const last = new Date(Date.UTC(y,m,0)).getUTCDate();
  return `${month}-${String(Math.min(Number(day),last)).padStart(2,"0")}`;
}
function cents(value, allowBlank=false) {
  if (allowBlank && String(value).trim()==="") return null;
  const n = Number(value);
  if (!Number.isFinite(n) || n<0 || Math.abs(n*100-Math.round(n*100))>0.00001)
    throw Error("Enter a valid peso amount with at most two decimal places.");
  const c = Math.round(n*100);
  if (!Number.isSafeInteger(c)) throw Error("Amount is too large.");
  return c;
}
const money = c => new Intl.NumberFormat("en-PH", {
  style:"currency", currency:"PHP"
}).format(c/100);
const sum = rows => rows.reduce((total,row)=>total+row.amount,0);

let db;
// load or create your shared prototype state
async function loadDb() {
  const snap = await docRef.get();
  if (snap.exists) {
    db = snap.data() || {};

    // Older/manual Firestore documents may use uppercase or legacy field names.
    // Normalize them in memory without deleting or rewriting the original fields.
    const arrayField = (canonical, aliases = []) => {
      const candidates = [canonical, ...aliases];
      let value;
      for (const key of candidates) {
        if (Array.isArray(db[key])) { value = db[key]; break; }
      }
      if (!Array.isArray(value)) value = [];
      // Record collections must contain objects, not empty-string placeholders.
      db[canonical] = value.filter(item =>
        item !== null && typeof item === "object" && !Array.isArray(item)
      );
    };

    arrayField("users", ["USERS", "user", "USER"]);
    arrayField("plans", ["PLANS"]);
    arrayField("clients", ["CLIENTS"]);
    arrayField("invoices", ["INVOICES"]);
    arrayField("payments", ["PAYMENTS"]);
    arrayField("reversals", ["REVERSALS"]);
    arrayField("expenses", ["EXPENSES", "EXPENCES", "EXPENCE"]);
    arrayField("handovers", ["HANDOVERS"]);
    arrayField("shifts", ["SHIFTS", "SHIFT"]);
    arrayField("audit", ["AUDIT"]);

    const labels = Array.isArray(db.labels) ? db.labels : [];
    db.labels = labels.filter(label => typeof label === "string" && label.trim());
    if (!db.labels.length) db.labels = ["Fuel","Cash","Rent","ISP Payment","Others"];

    db._revision = Number(db._revision || 0);
  } else {
    db = {
      _revision:0,
      users:[{ id:"admin", name:"Administrator", email:"admin@example.test", mobile:"", role:"admin"}],
      plans:[], clients:[], invoices:[], payments:[], reversals:[],
      expenses:[], labels:["Fuel","Cash","Rent","ISP Payment","Others"],
      handovers:[], shifts:[], audit:[]
    };
    await docRef.set(db);
  }
}

// Queue local writes and compare revisions so two rapid actions in this tab
// do not race each other or silently overwrite a newer session's data.
let saveQueue = Promise.resolve();
function save() {
  const task = saveQueue.then(async()=>{
    try {
      const nextRevision = await dbCloud.runTransaction(async transaction => {
        const snap = await transaction.get(docRef);
        const currentRevision = snap.exists ? Number(snap.data()._revision || 0) : 0;
        if (currentRevision !== Number(db._revision || 0)) {
          throw Error("The database changed in another session. Reload the tracker before saving again.");
        }
        const revision = currentRevision + 1;
        transaction.set(docRef, {
          ...db,
          _revision:revision,
          _updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        return revision;
      });
      db._revision = nextRevision;
    } catch(e) {
      console.error("Save failed:",e);
      throw e;
    }
  });
  saveQueue = task.catch(()=>{});
  return task;
}
let userId = null;
let signedInUser = null;
let page = "Dashboard";
let calendarMonth = thisMonth();
let selectedDay = today();
let clientQuery = "";

const user = () => db?.users?.find(u=>u.id===userId);
const admin = () => !!signedInUser && (signedInUser.email||"").toLowerCase()===ADMIN_EMAIL && user()?.role==="admin";

function requireUser() {
  if (!signedInUser || !user()) throw Error("Please sign in with the authorized administrator account.");
}
function requireAdmin() {
  requireUser();
  if (!admin()) throw Error("Only an administrator can do that.");
}
function notify(text) {
  $("notice").textContent=text;
  $("notice").hidden=false;
  clearTimeout(notify.timer);
  notify.timer=setTimeout(()=>$("notice").hidden=true,5000);
}
function audit(action,entity) {
  db.audit.push({
    id:uuid(), at:new Date().toISOString(), actor:user()?.email || "system",
    action, entity
  });
}
async function commit(action,entity) {
  audit(action,entity);
  try {
    await save();
    if ($("modal").open) $("modal").close();
    notify("Saved successfully.");
    render();
  } catch(error) {
    try { await loadDb(); } catch(reloadError) { console.error("Reload after failed save also failed:",reloadError); }
    notify("Save failed; the latest saved data has been reloaded. Verify the record before trying again: "+error.message);
    render();
  }
}

function activeShift(id=userId) {
  return db.shifts.find(s=>s.userId===id && !s.endedAt);
}
function reversed(paymentId) {
  return db.reversals.some(r=>r.paymentId===paymentId);
}
function paymentNet(clientId) {
  return sum(db.payments.filter(p=>p.clientId===clientId && !reversed(p.id)));
}

/* Bills are stored individually. Editing a plan or client never rewrites
   existing invoices. Monthly charges become available in their billing month. */
function ensureBills() {
  let changed=false;
  for (const c of db.clients) {
    if (c.opening>0 && !db.invoices.some(i=>i.key===`${c.id}:opening`)) {
      db.invoices.push({
        id:uuid(), key:`${c.id}:opening`, clientId:c.id,
        month:"opening", due:c.openingDate, amount:c.opening,
        plan:"Opening balance"
      });
      changed=true;
    }
    if (!c.start || !c.schedules.length) continue;
    for (let m=c.start; m<=thisMonth(); m=nextMonth(m)) {
      const s=[...c.schedules].reverse().find(s=>s.from<=m);
      if (!s || s.fee===null || !s.due) continue;
      const key=`${c.id}:${m}`;
      if (db.invoices.some(i=>i.key===key)) continue;
      db.invoices.push({
        id:uuid(), key, clientId:c.id, month:m,
        due:dueDate(m,s.due), amount:s.fee, plan:s.plan
      });
      changed=true;
    }
  }
  if (changed) save().catch(error=>notify("Billing update was not saved: "+error.message));
}
function allocation(clientId) {
  let credit=paymentNet(clientId);
  return db.invoices.filter(i=>i.clientId===clientId)
    .sort((a,b)=>a.due.localeCompare(b.due)||a.key.localeCompare(b.key))
    .map(i=>{
      const applied=Math.min(credit,i.amount);
      credit-=applied;
      return {...i, remaining:i.amount-applied};
    });
}
function balance(clientId) {
  return sum(db.invoices.filter(i=>i.clientId===clientId))-paymentNet(clientId);
}
function overdue(clientId,day=today()) {
  return allocation(clientId)
    .filter(i=>i.due<day).reduce((total,i)=>total+i.remaining,0);
}
function cashHeld(id) {
  const cash=sum(db.payments.filter(p=>
    p.recorderId===id && p.method==="Cash" && !reversed(p.id)));
  const handed=sum(db.handovers.filter(h=>
    h.collectorId===id && h.status==="Confirmed"));
  return cash-handed;
}
function pendingHandovers(id) {
  return db.handovers.filter(h=>h.collectorId===id && h.status==="Pending");
}
function availableCash(id) {
  return cashHeld(id)-sum(pendingHandovers(id));
}
function ledger() {
  const originals=db.payments.map(p=>({...p,kind:"Payment"}));
  const negatives=db.reversals.map(r=>{
    const p=db.payments.find(p=>p.id===r.paymentId);
    return {
      ...p,id:r.id,date:r.date,amount:-p.amount,kind:"Reversal",
      recorderEmail:r.actorEmail
    };
  });
  return [...originals,...negatives];
}

function table(headers,rows) {
  return `<div class="table-wrap"><table><thead><tr>
    ${headers.map(h=>`<th>${esc(h)}</th>`).join("")}
    </tr></thead><tbody>${rows.length?rows.join(""):
    `<tr><td colspan="${headers.length}" class="empty">No records yet.</td></tr>`}
    </tbody></table></div>`;
}
function metric(label,value) {
  return `<div class="card metric"><span class="muted">${esc(label)}</span>
    <strong>${esc(value)}</strong></div>`;
}
function clientName(id) {
  return db.clients.find(c=>c.id===id)?.name || "Unknown client";
}
function userName(id) {
  return db.users.find(u=>u.id===id)?.name || "Unknown user";
}
function render() {
  $("logoutButton").hidden=!signedInUser;
  $("signedInAs").textContent=signedInUser ? signedInUser.email : "";
  if (!signedInUser || !admin() || !user()) {
    $("nav").innerHTML="";
    $("main").innerHTML=`<div class="card"><h2>Administrator sign in</h2>
      <p>Use the authorized owner email address to access the tracker.</p>
      <form id="loginForm">
        <label>Email address<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <div class="toolbar"><button class="primary" type="submit">Sign in</button>
        <button type="button" id="resetPassword">Send password reset</button></div>
      </form>
      <p class="muted">Only the authorized administrator can sign in in this release. Collector access is intentionally unavailable until individual staff permissions are implemented.</p>
      <p id="loginError" role="alert"></p></div>`;
    $("loginForm").onsubmit=async event=>{
      event.preventDefault();
      const form=new FormData(event.target);
      const email=String(form.get("email")).trim().toLowerCase();
      if(email!==ADMIN_EMAIL){$("loginError").textContent="This account is not authorized.";return;}
      try { await auth.signInWithEmailAndPassword(email,String(form.get("password"))); }
      catch(error){$("loginError").textContent="Sign in failed: "+error.message;}
    };
    $("resetPassword").onclick=async()=>{
      const email=$("loginForm").elements.email.value.trim().toLowerCase();
      if(email!==ADMIN_EMAIL){$("loginError").textContent="Enter the authorized administrator email first.";return;}
      try { await auth.sendPasswordResetEmail(email); $("loginError").textContent="Password reset email sent."; }
      catch(error){$("loginError").textContent="Could not send reset email: "+error.message;}
    };
    return;
  }
  ensureBills();
  const pages=["Dashboard","Clients","Payments","Expenses","Calendar","Cash","Reminders"];
  if (admin()) pages.push("Plans","Staff","Reports");
  if (!pages.includes(page)) page="Dashboard";
  $("nav").innerHTML=pages.map(p=>`<button class="${page===p?"active":""}"
    onclick="go('${p}')">${p}</button>`).join("");
  const views={
    Dashboard:dashboard,Clients:clientsView,Payments:paymentsView,
    Expenses:expensesView,Calendar:calendarView,Cash:cashView,
    Reminders:remindersView,Plans:plansView,Staff:staffView,Reports:reportsView
  };
  $("main").innerHTML=views[page]();
}
function go(p) { page=p; render(); }

function dashboard() {
  const entries=ledger();
  const daily=sum(entries.filter(p=>p.date===today()));
  const monthly=sum(entries.filter(p=>monthOf(p.date)===thisMonth()));
  const dailyExpenses=sum(db.expenses.filter(e=>e.date===today()));
  const monthlyExpenses=sum(db.expenses.filter(e=>monthOf(e.date)===thisMonth()));
  const owed=db.clients.reduce((n,c)=>n+Math.max(0,balance(c.id)),0);
  const overdueCount=db.clients.filter(c=>overdue(c.id)>0).length;
  return `<h2>Dashboard</h2><div class="grid">
    ${metric("Today's collections",money(daily))}
    ${metric("Today's expenses",money(dailyExpenses))}
    ${metric("Today's gross income",money(daily-dailyExpenses))}
    ${metric("Monthly collections",money(monthly))}
    ${metric("Monthly expenses",money(monthlyExpenses))}
    ${metric("Monthly gross income",money(monthly-monthlyExpenses))}
    ${metric("Outstanding balances",money(owed))}
    ${metric("Overdue clients",overdueCount)}
    ${metric("Monthly cash",money(sum(entries.filter(p=>
      p.method==="Cash" && monthOf(p.date)===thisMonth()))))}
    ${metric("Monthly GCash",money(sum(entries.filter(p=>
      p.method==="GCash" && monthOf(p.date)===thisMonth()))))}
    </div><div class="card">
    <p><strong>Gross income:</strong> recorded collections minus recorded expenses,
    using your requested label. Reversals are deducted on their reversal date.</p>
    <p class="muted">Local-device totals only. This prototype has no cloud synchronization.</p>
    <h3>Collections by staff — this month</h3>
    ${table(["Staff","Collections","Cash held"],db.users.map(u=>`<tr>
      <td>${esc(u.name)}</td>
      <td>${money(sum(entries.filter(p=>p.recorderId===u.id &&
        monthOf(p.date)===thisMonth())))}</td>
      <td>${money(cashHeld(u.id))}</td></tr>`))}
    </div>`;
}
function clientsView() {
  const list=db.clients.filter(c=>
    [c.name,c.account,c.phone,c.address].join(" ").toLowerCase()
      .includes(clientQuery.toLowerCase()));
  return `<h2>Clients</h2><div class="toolbar">
    <input placeholder="Search name, account, phone, address"
      value="${esc(clientQuery)}" oninput="searchClients(this.value)">
    ${admin()?`<button class="primary" onclick="clientForm()">Add client</button>
      <button onclick="document.getElementById('csvFile').click()">Import CSV</button>
      <input id="csvFile" type="file" accept=".csv" hidden onchange="importCSV(this)">`:""}
    </div><div class="card">${table(
      ["Name / Account","Contact","Plan / Monthly due","Due day","Balance","Actions"],
      list.map(c=>{
        const s=c.schedules.at(-1);
        return `<tr><td>${esc(c.name)}<br><small>${esc(c.account)}</small></td>
          <td>${esc(c.phone)}<br><small>${esc(c.address)}</small></td>
          <td>${esc(s?.plan || "Not set")}<br>
            ${s?.fee!==null && s?.fee!==undefined?money(s.fee):"Not set"}
            ${s?.from>thisMonth()?`<br><small>Effective ${esc(s.from)}</small>`:""}
          </td><td>${s?.due || "Not set"}</td>
          <td>${money(balance(c.id))}
            ${overdue(c.id)>0?'<span class="badge bad">Overdue</span>':""}</td>
          <td><button onclick="paymentForm('${c.id}')">Pay</button>
            <button onclick="statement('${c.id}')">History</button>
            ${admin()?`<button onclick="clientForm('${c.id}')">Edit</button>`:""}
          </td></tr>`;
      }))}</div>`;
}
function searchClients(value) {
  clientQuery=value;
  const input=document.activeElement;
  const pos=input.selectionStart;
  $("main").innerHTML=clientsView();
  const replacement=$("main").querySelector("input");
  replacement.focus();
  replacement.setSelectionRange(pos,pos);
}
function field(label,name,value="",type="text",extra="") {
  return `<label>${label}<input name="${name}" type="${type}"
    value="${esc(value)}" ${extra}></label>`;
}
function openForm(title,content,handler) {
  $("modal").innerHTML=`<h2>${esc(title)}</h2><form id="entryForm">
    ${content}<div class="actions">
    <button type="button" onclick="document.getElementById('modal').close()">Cancel</button>
    <button class="primary" type="submit">Save</button></div></form>`;
  $("entryForm").onsubmit=event=>{
    event.preventDefault();
    try { handler(new FormData(event.target)); }
    catch(error) { notify(error.message); }
  };
  $("modal").showModal();
}
function clientForm(id="") {
  requireAdmin();
  const c=db.clients.find(c=>c.id===id);
  const s=c?.schedules.at(-1);
  openForm(c?"Edit client":"Add client",`
    ${field("Name *","name",c?.name || "","text","required")}
    ${field("Address","address",c?.address || "")}
    ${field("Phone number","phone",c?.phone || "","tel")}
    ${field("Account number","account",c?.account || "")}
    <label>Choose a saved plan
      <select onchange="fillPlan(this.value)">
        <option value="">Custom / leave blank</option>
        ${db.plans.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.fee)}</option>`).join("")}
      </select>
    </label>
    ${field("Internet monthly plan","plan",s?.plan || "")}
    ${field("Monthly payment amount (₱)","fee",s?.fee==null?"":s.fee/100,
      "number",'min="0" step="0.01"')}
    ${field("Monthly due day (1–31)","due",s?.due || "",
      "number",'min="1" max="31" step="1"')}
    ${!c?`
      ${field("Billing start month (optional)","start","","month")}
      ${field("Opening balance (₱)","opening","0","number",'min="0" step="0.01"')}
      ${field("Opening balance due date","openingDate",today(),"date")}
    `:`<p class="muted">Billing changes apply next month.
      Existing bills and opening balances are preserved.</p>`}
  `,f=>{
    requireAdmin();
    const name=f.get("name").trim();
    if (!name) throw Error("Client name is required.");
    const account=f.get("account").trim();
    if (account && db.clients.some(x=>x.account===account && x.id!==id))
      throw Error("That account number already exists.");
    const fee=cents(f.get("fee"),true);
    const due=f.get("due")===""?null:Number(f.get("due"));
    if (due!==null && (!Number.isInteger(due)||due<1||due>31))
      throw Error("Due day must be 1–31.");
    const profile={
      name,address:f.get("address").trim(),phone:f.get("phone").trim(),account
    };
    const schedule={plan:f.get("plan").trim(),fee,due};
    if (c) {
      Object.assign(c,profile);
      if (!s || s.plan!==schedule.plan || s.fee!==fee || s.due!==due) {
        const from=nextMonth(thisMonth());
        c.schedules=c.schedules.filter(x=>x.from!==from);
        c.schedules.push({...schedule,from});
      }
      commit("Client updated",c.id);
    } else {
      const start=f.get("start") || "";
      if (start && start<"2000-01") throw Error("Use a start month from 2000 onward.");
      const opening=cents(f.get("opening"));
      const created={
        id:uuid(),...profile,start,opening,
        openingDate:f.get("openingDate") || today(),
        schedules:[{...schedule,from:start || thisMonth()}]
      };
      db.clients.push(created);
      commit("Client created",created.id);
    }
  });
}

function calendarForecast(month) {
  const result = new Map();

  for (const c of db.clients) {
    // Copy existing bills; never modify the original records.
    const bills = db.invoices
      .filter(i => i.clientId === c.id)
      .map(i => ({ ...i, projected: false }));

    // Generate temporary monthly bills for this calendar forecast.
    if (c.start && c.schedules.length) {
      for (
        let billingMonth = c.start;
        billingMonth <= month;
        billingMonth = nextMonth(billingMonth)
      ) {
        const key = `${c.id}:${billingMonth}`;

        if (bills.some(i => i.key === key)) continue;

        const schedule = [...c.schedules]
          .sort((a, b) => b.from.localeCompare(a.from))
          .find(s => s.from <= billingMonth);

        if (!schedule || schedule.fee === null || !schedule.due) {
          continue;
        }

        bills.push({
          id: `forecast:${key}`,
          key,
          clientId: c.id,
          month: billingMonth,
          due: dueDate(billingMonth, schedule.due),
          amount: schedule.fee,
          plan: schedule.plan,
          projected: true
        });
      }
    }

    bills.sort((a, b) =>
      a.due.localeCompare(b.due) ||
      a.key.localeCompare(b.key)
    );

    // Recorded payments include any account credit.
    let credit = paymentNet(c.id);

    const allocated = bills.map(bill => {
      const applied = Math.min(credit, bill.amount);
      credit -= applied;

      return {
        ...bill,
        remaining: bill.amount - applied
      };
    });

    result.set(c.id, {
      bills: allocated,
      // A negative balance means the client has account credit.
      balance: sum(bills) - paymentNet(c.id)
    });
  }

  return result;
}

function calendarView() {
  const [year, month] = calendarMonth.split("-").map(Number);
  const first = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
  const days = new Date(Date.UTC(year, month, 0)).getUTCDate();

  const forecast = calendarForecast(calendarMonth);
  const allBills = [...forecast.values()]
    .flatMap(client => client.bills);

  const entries = ledger();

  let cells = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
    .map(day => `<strong style="text-align:center">${day}</strong>`)
    .join("");

  cells += "<div></div>".repeat(first);

  for (let day = 1; day <= days; day++) {
    const date =
      `${calendarMonth}-${String(day).padStart(2, "0")}`;

    const billsDue = allBills.filter(bill => bill.due === date);
    const dueClients = new Set(billsDue.map(bill => bill.clientId));

    const unpaidClients = new Set(
      billsDue
        .filter(bill => bill.remaining > 0)
        .map(bill => bill.clientId)
    );

    const collections = sum(
      entries.filter(payment => payment.date === date)
    );

    cells += `
      <button
        class="day ${selectedDay === date ? "selected" : ""}"
        onclick="selectDay('${date}')"
      >
        <strong>${day}</strong>
        <small>${dueClients.size} clients due</small>
        <small>${unpaidClients.size} unpaid</small>
        <small>${money(collections)} collected</small>
      </button>
    `;
  }

  const selectedBills = allBills.filter(
    bill => bill.due === selectedDay
  );

  const dueIds = [...new Set(
    selectedBills.map(bill => bill.clientId)
  )];

  const monthCollections = sum(
    entries.filter(payment =>
      monthOf(payment.date) === calendarMonth
    )
  );

  const monthDues = sum(
    allBills.filter(bill => bill.month === calendarMonth)
  );

  const unpaidAccounts = [...forecast.values()]
    .filter(client => client.balance > 0).length;

  const totalOutstanding = [...forecast.values()]
    .reduce(
      (total, client) => total + Math.max(0, client.balance),
      0
    );

  const dayPayments = entries.filter(
    payment => payment.date === selectedDay
  );

  const isFuture = calendarMonth > thisMonth();

  return `
    <h2>Calendar</h2>

    <div class="toolbar">
      <button onclick="shiftCalendarMonth(-1)" ${calendarMonth<="2026-01"?"disabled":""}>Previous</button>
      <input type="month" min="2026-01" max="2050-12" value="${calendarMonth}" onchange="setMonth(this.value)">
      <button onclick="shiftCalendarMonth(1)" ${calendarMonth>="2050-12"?"disabled":""}>Next</button>
      ${isFuture
        ? '<span class="badge warn">Future billing forecast</span>'
        : ""}
    </div>

    <div class="grid">
      ${metric("Monthly dues", money(monthDues))}
      ${metric("Recorded monthly collections", money(monthCollections))}
      ${metric(
        isFuture ? "Projected outstanding balance" : "Outstanding balance",
        money(totalOutstanding)
      )}
      ${metric("Unpaid accounts", unpaidAccounts)}
    </div>

    <div class="card">
      <p class="muted">
        Future months include carried-over balances and projected monthly
        charges based on the admin's billing settings. Only payments already
        recorded are deducted; future payments are not assumed.
        This is not a historical month-end statement.
      </p>
      <div class="calendar">${cells}</div>
    </div>

    <div class="card">
      <h3>${selectedDay} — clients due</h3>

      ${table(
        [
          "Client",
          "Monthly due",
          "Unpaid before this date",
          "Balance including selected month"
        ],
        dueIds.map(id => {
          const client = forecast.get(id);

          const monthlyDue = sum(
            client.bills.filter(
              bill => bill.month === calendarMonth
            )
          );

          const carriedBalance = client.bills
            .filter(bill => bill.due < selectedDay)
            .reduce(
              (total, bill) => total + bill.remaining,
              0
            );

          return `
            <tr>
              <td>${esc(clientName(id))}</td>
              <td>${money(monthlyDue)}</td>
              <td>${money(carriedBalance)}</td>
              <td>${money(client.balance)}</td>
            </tr>
          `;
        })
      )}

      <h3>Payment history for selected day</h3>

      ${table(
        ["Client", "Type", "Amount", "Method"],
        dayPayments.map(payment => `
          <tr>
            <td>${esc(clientName(payment.clientId))}</td>
            <td>${esc(payment.kind)}</td>
            <td>${money(payment.amount)}</td>
            <td>${esc(payment.method)}</td>
          </tr>
        `)
      )}
    </div>
  `;
}function selectDay(day) { selectedDay=day; render(); }
function setMonth(month) {
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month || "")) return;
  const year=Number(month.slice(0,4));
  if(year<2026 || year>2050) return notify("Calendar supports 2026 through 2050.");
  calendarMonth=month;
  selectedDay=month+"-01";
  render();
}
function shiftCalendarMonth(delta) {
  const parts=calendarMonth.split("-").map(Number);
  const d=new Date(Date.UTC(parts[0],parts[1]-1+delta,1));
  const target=d.toISOString().slice(0,7);
  const year=Number(target.slice(0,4));
  if(year<2026 || year>2050) return;
  setMonth(target);
}

/* CSV: supports quoted commas, embedded newlines, and escaped double quotes. */
function parseCSV(text) {
  text=text.replace(/^\uFEFF/,"");
  const rows=[]; let row=[],value="",quoted=false;
  for (let i=0;i<text.length;i++) {
    const ch=text[i];
    if (ch==='"') {
      if (quoted && text[i+1]==='"') { value+='"'; i++; }
      else quoted=!quoted;
    } else if (ch==="," && !quoted) {
      row.push(value); value="";
    } else if ((ch==="\n" || ch==="\r") && !quoted) {
      if (ch==="\r" && text[i+1]==="\n") i++;
      row.push(value);
      if (row.some(v=>v.trim())) rows.push(row);
      row=[];value="";
    } else value+=ch;
  }
  if (quoted) throw Error("CSV contains an unclosed quote.");
  row.push(value);
  if (row.some(v=>v.trim())) rows.push(row);
  return rows;
}
async function importCSV(input) {
  try {
    requireAdmin();
    const file=input.files[0];
    if (!file) return;
    const rows=parseCSV(await file.text());
    const headers=rows.shift()?.map(h=>h.trim().toLowerCase()
      .replace(/[ .-]+/g,"_"));
    const aliases={
      name:["name","client","client_name","customer","customer_name"],
      address:["address","location","barangay"],
      phone:["phone","contact","contact_no","contact_number","mobile"],
      account_number:["account_number","account","account_no","client_id"],
      internet_plan:["internet_plan","plan","package"],
      monthly_fee:["monthly_fee","monthly_due","monthly_amount","plan_fee"],
      due_day:["due_day","billing_day","day_due"],
      due_date:["due_date","payment_due_date"],
      opening_balance:["opening_balance","due_amount","balance","outstanding_balance"],
      billing_start_month:["billing_start_month","start_month","billing_month"]
    };
    const columns={};
    for (const [key,names] of Object.entries(aliases))
      columns[key]=headers?.findIndex(h=>names.includes(h)) ?? -1;
    if (columns.name<0) throw Error("CSV needs a Name or Client column.");
    const get=(row,key)=>columns[key]>=0?(row[columns[key]] || "").trim():"";
    const known=new Set(db.clients.map(c=>c.account).filter(Boolean));
    const knownNames=new Set(db.clients.map(c=>c.name.trim().toLowerCase()));
    const staged=[];
    rows.forEach((row,index)=>{
      try {
        const name=get(row,"name");
        if (!name) throw Error("Name is required.");
        const account=get(row,"account_number");
        if (account && known.has(account)) throw Error("Duplicate account number.");
        if (!account && knownNames.has(name.toLowerCase()))
          throw Error("A client with this name already exists; add an account number to distinguish them.");
        let dueText=get(row,"due_day");
        const dueDateText=get(row,"due_date");
        if (!dueText && dueDateText) {
          const isoDate=dueDateText.match(/^\d{4}-\d{1,2}-(\d{1,2})$/);
          const slashDate=dueDateText.match(/^\d{1,2}\/\d{1,2}\/\d{2,4}$/);
          if (isoDate) dueText=isoDate[1];
          else if (/^\d{1,2}$/.test(dueDateText)) dueText=dueDateText;
          else if (slashDate) {
            throw Error("Ambiguous slash date. Use YYYY-MM-DD or provide a due-day number in a Due Day column.");
          }
        }
        const due=dueText?Number(dueText):null;
        if (due!==null && (!Number.isInteger(due)||due<1||due>31))
          throw Error("Due day must be 1–31.");
        const start=get(row,"billing_start_month");
        if (start && (!/^\d{4}-(0[1-9]|1[0-2])$/.test(start)||start<"2000-01"))
          throw Error("Invalid billing start month.");
        const fee=cents(get(row,"monthly_fee"),true);
        const opening=cents(get(row,"opening_balance") || "0");
        staged.push({
          id:uuid(),name,account,address:get(row,"address"),phone:get(row,"phone"),
          start,opening,openingDate:start?`${start}-01`:today(),
          schedules:[{
            from:start || thisMonth(),plan:get(row,"internet_plan"),fee,due
          }]
        });
        if (account) known.add(account);
        knownNames.add(name.toLowerCase());
      } catch(error) {
        throw Error(`CSV row ${index+2}: ${error.message}`);
      }
    });
    if (!staged.length) throw Error("No clients found.");
    if (!confirm(`Validated ${staged.length} clients. Import all of them?`)) return;
    db.clients.push(...staged);
    commit("Clients imported",String(staged.length));
    notify(`${staged.length} clients imported.`);
  } catch(error) { notify(error.message); }
  finally { input.value=""; }
}
function download(name,text,type="text/csv;charset=utf-8") {
  const url=URL.createObjectURL(new Blob([text],{type}));
  const a=document.createElement("a");
  a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvCell(value) {
  let s=String(value ?? "");
  /* Protect spreadsheet exports from formula injection. */
  if (/^[=+\-@\t\r]/.test(s)) s="'"+s;
  return '"'+s.replace(/"/g,'""')+'"';
}
function csvDownload(name,headers,rows) {
  requireAdmin();
  download(name,[headers,...rows].map(row=>row.map(csvCell).join(",")).join("\r\n"));
}

/* Warn about closing an active shift, but browser closure cannot be prevented. */
window.addEventListener("beforeunload",event=>{
  if (user() && !admin() && activeShift()) {
    event.preventDefault();
    event.returnValue="";
  }
});

// Authentication is checked before any business data is read.
auth.onAuthStateChanged(async authUser=>{
  signedInUser=authUser;
  userId=null;
  if (!authUser) { render(); return; }
  if ((authUser.email||"").toLowerCase()!==ADMIN_EMAIL) {
    await auth.signOut();
    render();
    return;
  }
  if (!authUser.emailVerified) {
    $("nav").innerHTML="";
    $("logoutButton").hidden=false;
    $("signedInAs").textContent=authUser.email;
    $("main").innerHTML=`<div class="card"><h2>Verify your administrator email</h2>
      <p>Firebase requires the owner email to be verified before the tracker can access business records.</p>
      <div class="toolbar"><button class="primary" id="sendVerification">Send verification email</button>
      <button id="checkVerification">I have verified — check again</button></div>
      <p id="verificationMessage" role="status"></p></div>`;
    $("sendVerification").onclick=async()=>{
      try { await authUser.sendEmailVerification(); $("verificationMessage").textContent="Verification email sent. Check your inbox and spam folder."; }
      catch(error){$("verificationMessage").textContent="Could not send verification email: "+error.message;}
    };
    $("checkVerification").onclick=async()=>{
      try { await auth.currentUser.reload(); signedInUser=auth.currentUser;
        if(auth.currentUser.emailVerified) window.location.reload();
        else $("verificationMessage").textContent="The email is not verified yet.";
      } catch(error){$("verificationMessage").textContent="Could not check verification: "+error.message;}
    };
    return;
  }
  try {
    await loadDb();
    if (!db.users) db.users=[];
    let owner=db.users.find(u=>u.role==="admin" && (u.email||"").toLowerCase()===ADMIN_EMAIL);
    if (!owner) {
      owner=db.users.find(u=>u.role==="admin");
      if (owner) { owner.email=ADMIN_EMAIL; owner.name=owner.name||"Administrator"; }
      else { owner={id:"admin",name:"Administrator",email:ADMIN_EMAIL,mobile:"",role:"admin"}; db.users.push(owner); }
      await save();
    }
    userId=owner.id;
    render();
  } catch(e) {
    console.error("Failed to load tracker data:",e);
    $("main").innerHTML="<div class='card'><h2>Unable to load tracker data</h2><p>Check Firebase Authentication and Firestore security rules. Existing data has not been overwritten.</p><p>"+esc(e.message)+"</p></div>";
  }
});
</script>
