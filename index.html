<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISP Payment Tracker — Prototype</title>
<style>
:root {
  --blue:#2563eb; --bg:#f3f6fb; --ink:#172033;
  --muted:#64748b; --line:#dce3ee;
}
* { box-sizing:border-box }
body {
  margin:0; font:15px system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
}
header {
  background:#15233d; color:white; padding:18px;
  display:flex; justify-content:space-between;
  align-items:center; flex-wrap:wrap; gap:12px;
}
h1 { margin:0; font-size:22px }
h2 { margin:0 0 16px }
h3 { margin:8px 0 }
small,.muted { color:var(--muted) }
header small { color:#cbd5e1 }
button,input,select,textarea {
  font:inherit; padding:10px; border:1px solid var(--line);
  border-radius:8px;
}
button { cursor:pointer; background:white }
button.primary { background:var(--blue); color:white; border:0 }
button.danger { color:#b91c1c }
button:disabled { opacity:.5; cursor:not-allowed }
nav {
  display:flex; gap:8px; padding:12px 18px; overflow:auto;
  background:white; border-bottom:1px solid var(--line);
}
nav button.active { background:var(--blue); color:white }
main { max-width:1250px; margin:auto; padding:20px }
.banner {
  background:#fff3cd; padding:12px 18px;
  border-bottom:1px solid #edd78e;
}
.card {
  background:white; border:1px solid var(--line);
  border-radius:12px; padding:18px; margin-bottom:16px;
}
.grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px;
}
.metric strong { display:block; font-size:26px; margin-top:8px }
.toolbar {
  display:flex; flex-wrap:wrap; gap:10px;
  align-items:center; margin-bottom:16px;
}
.table-wrap { overflow:auto }
table { width:100%; border-collapse:collapse; white-space:nowrap }
th,td {
  padding:11px; text-align:left; border-bottom:1px solid var(--line);
}
th { background:#f8fafc }
.badge {
  display:inline-block; border-radius:20px; padding:4px 9px;
  background:#e8efff; font-size:12px;
}
.badge.warn { background:#fff0d4; color:#92400e }
.badge.bad { background:#fee2e2; color:#991b1b }
.calendar {
  display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px;
}
.day {
  min-height:110px; text-align:left; background:white;
  padding:8px; overflow:hidden;
}
.day small { display:block; font-size:11px; white-space:normal }
.day.selected { outline:2px solid var(--blue) }
dialog {
  border:0; border-radius:12px; width:min(600px,95vw);
  max-height:90vh; padding:22px;
}
dialog::backdrop { background:#0008 }
label { display:block; margin:12px 0 }
label input,label select,label textarea { width:100%; margin-top:5px }
.actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px }
#notice {
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  background:#172033; color:white; padding:12px 20px;
  border-radius:10px; z-index:20; max-width:90%;
}
.empty { padding:20px; color:var(--muted) }
@media(max-width:600px) {
  main { padding:12px }
  .day { min-height:85px; padding:5px }
  .day small { font-size:9px }
  th,td { padding:8px }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>ISP Payment Tracker</h1>
    <small>Philippine pesos · Philippine billing dates</small>
  </div>
  <div class="toolbar" style="margin:0">
    <select id="account" aria-label="Demo account"></select>
    <button id="shiftButton" onclick="toggleShift()">Start shift</button>
    <button onclick="logout()">Log out</button>
  </div>
</header>

<div class="banner">
  <strong>LOCAL TEST PROTOTYPE:</strong>
  No secure login, cloud sync, or automatic emails.
  Use sample data only. Account switching is provided for testing.
</div>

<nav id="nav"></nav>
<main id="main"></main>

<div id="notice" hidden></div>

</body>
</html>
