name: Deploy Olango Fiber Tracker to GitHub Pages

on:
  push:
    branches:
      - main
      - fix/payment-tracker-stability
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.I|re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript blocks found")
          Path("/tmp/inline-check.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          print(f"Found {len(scripts)} inline script block(s)")
          PY
          node --check /tmp/inline-check.js

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
