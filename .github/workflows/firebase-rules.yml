name: Firebase Rules Tests

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "tests/**"
      - ".github/workflows/firebase-rules.yml"
  push:
    branches:
      - development
      - feature/admin-controls-calendar-2050
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "tests/**"
      - ".github/workflows/firebase-rules.yml"

jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund
      - name: Run Firestore Emulator rules suite
        working-directory: tests
        run: npm test
